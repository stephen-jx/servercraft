version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: servercraft-postgres
    environment:
      POSTGRES_USER: servercraft
      POSTGRES_PASSWORD: servercraft123
      POSTGRES_DB: servercraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servercraft"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: servercraft-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servercraft-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://servercraft:servercraft123@postgres:5432/servercraft
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-in-production
      DEBUG: "false"
    volumes:
      - ./ansible:/app/ansible
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servercraft-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Celery worker for background tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servercraft-celery
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://servercraft:servercraft123@postgres:5432/servercraft
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data: